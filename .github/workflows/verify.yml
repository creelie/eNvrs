name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    name: Interval re-check, C and Julia checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install mpmath==1.3.0
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"
      - run: scripts/fast_checks.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-checks
          path: build/fast-checks/

  cap:
    name: Computer-assisted proof (CAPD)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install mpmath==1.3.0
      - name: Install build tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends cmake g++ bc
      - name: Cache CAPD
        id: capd-cache
        uses: actions/cache@v4
        with:
          path: capd-install
          key: capd-2f060980d0685cc9bf88352e08c242197cd7d686-${{ runner.os }}-ubuntu-24.04
      - if: steps.capd-cache.outputs.cache-hit != 'true'
        run: scripts/build_capd.sh capd-install
      - name: Run the five cases
        run: cap/run_all.sh "$PWD/capd-install/bin/capd-config"
      - name: Re-check the fresh enclosures in 60-digit interval arithmetic
        run: python3 crosscheck/recheck.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cap-logs
          path: cap/logs/

  lean:
    name: Lean proofs and axiom audit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lake exe cache get
      - run: lake build
      - name: Axiom audit
        run: |
          lake env lean CheckDyadic.lean | tee check.log
          if grep -q "sorryAx\|ofReduceBool" check.log; then
            echo "a theorem depends on sorry or on native evaluation" >&2
            exit 1
          fi
          test "$(grep -c 'depends on axioms' check.log)" -eq 8
          echo "8 theorems checked"

  paper:
    name: Build the paper
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra texlive-pictures texlive-publishers \
            texlive-fonts-recommended lmodern poppler-utils zip
      - run: scripts/build_paper.sh
      - uses: actions/upload-artifact@v4
        with:
          name: paper
          path: dist/
