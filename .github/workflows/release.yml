name: release

# Run by hand from the Actions tab (or the API) after the PR is merged:
# it tags the chosen commit, publishes a GitHub release with the files in
# dist/ and the notes in .github/RELEASE_NOTES.md, and Zenodo archives the
# release and mints a DOI if the repository is switched on at
# https://zenodo.org/account/settings/github/.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true
        default: "v1.0.0"
      target:
        description: "Branch or commit to tag"
        required: true
        default: "main"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
      - name: Check the release files
        run: |
          for f in dist/dyadic-blowup.pdf \
                   dist/dyadic-blowup-tex.zip \
                   dist/dyadic-blowup-arxiv.tar.gz; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$TARGET" \
            --title "$TAG: Blowup above the exponent one third in viscous Katz-Pavlovic dyadic models" \
            --notes-file .github/RELEASE_NOTES.md
